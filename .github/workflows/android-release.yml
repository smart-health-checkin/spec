name: Android wallet release

# Builds the reference Android wallet as a debuggable APK and publishes it as a
# GitHub release. Every release is signed with the same debug key (repository
# secret ANDROID_DEBUG_KEYSTORE_B64), so each one installs over the last.
#
# Stable download link for the latest release:
#   https://github.com/smart-health-checkin/spec/releases/latest/download/smart-checkin-wallet-debug.apk
on:
  push:
    tags: ["wallet-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the fixed debug signing key
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
      - name: Build
        # The matcher (app/src/main/assets/matcher.wasm) is committed, so the
        # nightly Rust toolchain isn't needed here. Rebuild it locally with
        # app/matcher-rs/build.sh when its source changes.
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#wallet-v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION_NAME="0.1.${{ github.run_number }}-dev"
          ./gradlew :app:assembleDebug -Pskip-matcher \
            -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk smart-checkin-wallet-debug.apk
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || TAG="wallet-v$VERSION_NAME"
          gh release create "$TAG" smart-checkin-wallet-debug.apk \
            --title "Reference Android wallet $VERSION_NAME" \
            --notes "Debuggable build of the SMART Health Check-in reference Android wallet.

          Install on the phone by opening the APK link, or with adb:

              curl -LO https://github.com/smart-health-checkin/spec/releases/latest/download/smart-checkin-wallet-debug.apk
              adb install -r smart-checkin-wallet-debug.apk

          Requires Android 8 or later and a Chrome with the Digital Credentials API. Open the app once after installing so it registers with Credential Manager." \
            --latest
